<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Is your TYPO3 up to date?</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png" />
    <!-- No webfonts: no third-party host may be contacted. -->
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="t3-page">
      <!-- Static text is English by default; ui.ts localises it from the catalog on load. -->
      <header class="t3-bar">
        <span class="brand">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2.6 4 5.6v5.9c0 4.7 3.3 8.4 8 9.9 4.7-1.5 8-5.2 8-9.9V5.6z"></path>
            <path d="m8.8 11.8 2.4 2.4 4.2-4.6"></path>
          </svg>
          <span id="brand-text">TYPO3 Update Check</span>
        </span>
        <nav id="lang-toggle" class="lang-toggle" aria-label="Language" data-i18n-label="langNavLabel">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="de">DE</button>
        </nav>
        <a class="gh-link" href="https://github.com/plan2net/typo3-update-check" target="_blank" rel="noopener">GitHub</a>
      </header>

      <main class="t3-main">
        <div class="hero">
          <h1 id="app-title">Is your TYPO3 safe?</h1>
          <p id="app-tagline" class="tagline">
            Pick the version your site runs. We check it against every published TYPO3 security
            advisory and tell you whether a free update fixes it.
          </p>

          <div class="picker">
            <span id="pick-label" class="pick-label">My site runs</span>
            <div id="major-seg" class="seg" role="group" aria-label="TYPO3 major version" data-i18n-label="majorLabel"></div>
            <span class="selwrap">
              <label class="vh" id="version-select-label" for="version">Installed version</label>
              <select id="version" name="version"></select>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </span>
            <label class="elts-switch">
              <input type="checkbox" id="has-elts" />
              <span class="track" aria-hidden="true"></span>
              <span id="elts-label">We have ELTS</span>
            </label>
          </div>
        </div>

        <!-- Verdict sentence only: announcing all advisories on every pick would bury it. -->
        <p id="result-announce" class="vh" role="status" aria-live="polite"></p>

        <section id="result" class="t3-result" aria-label="Result" data-i18n-label="resultLabel"></section>
      </main>

      <footer class="t3-footer">
        <nav class="footer-links" aria-label="Resources" data-i18n-label="resourcesLabel">
          <a href="https://github.com/plan2net/typo3-update-check" target="_blank" rel="noopener">GitHub</a>
          <a href="https://docs.typo3.org" target="_blank" rel="noopener">Docs</a>
          <a href="https://packagist.org/packages/typo3/cms-core" target="_blank" rel="noopener">Packagist</a>
        </nav>
        <a class="made-by" href="https://www.plan2.net/" target="_blank" rel="noopener">
          <span id="made-by-text">Made with ♥ by</span>
          <img src="/plan2net-logo.svg" alt="plan2net" height="16" />
        </a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
